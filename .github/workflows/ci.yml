name: BAYSOZ Zero-Defect CI
on: [push, pull_request]
jobs:
  rust-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust_crypto_shield/Cargo.toml
  python-compliance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff pytest && ruff check python_kvkk_guard && PYTHONPATH=. pytest python_kvkk_guard/tests
